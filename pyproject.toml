[project]
name = "eu-pii-redact"
version = "0.1.0"
description = "Redact European personal data (names, national IDs, IBANs, emails, phones) before it reaches an LLM, and restore it afterwards. Python client and MCP server."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "JulianJohansen" }]
keywords = ["pii", "redaction", "anonymization", "gdpr", "llm", "mcp", "privacy", "data-masking"]
classifiers = [
    "Programming Language :: Python :: 3",
    "Topic :: Security",
    "Topic :: Text Processing",
    "Intended Audience :: Developers",
]
dependencies = ["httpx>=0.27", "mcp>=2.2"]

[project.optional-dependencies]
langchain = ["langchain-core>=1.0"]

[project.urls]
Homepage = "https://rapidapi.com/JulianJohansen/api/eu-pii-redaction"

[project.scripts]
eu-pii-redact = "eu_pii_redact.mcp_server:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[dependency-groups]
dev = [
    "fastapi>=0.142.2",
    "httpx>=0.28.1",
    "langchain-core>=1.6.6",
    "pytest",
    "python-stdnum>=2.2",
]
